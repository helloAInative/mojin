name: Bug report
description: 报告可复现的缺陷
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿粘贴 API Key、真实账户数据或未经脱敏的数据库内容。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明实际行为和期望行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 请求……
        3. 看到……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Rust 版本、Docker 版本等。
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell
