<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>摸金小王子 · 复盘工作台</title>
  <style>
    :root {
      --bg:#0b0f15; --card:#141a23; --card-2:#1a2230; --line:#283342;
      --txt:#e6edf3; --muted:#8fa1b3; --muted-2:#5f7286;
      --ok:#3fb950; --bad:#f85149; --acc:#f0b429; --tip:#58a6ff; --vio:#bc8cff;
      --shadow: 0 1px 0 rgba(255,255,255,.02), 0 8px 24px rgba(0,0,0,.25);
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "PingFang SC", system-ui, -apple-system, sans-serif;
           background:var(--bg); color:var(--txt); font-size:14px; line-height:1.55;
           background-image: radial-gradient(1200px 600px at 10% -10%, rgba(88,166,255,.06), transparent 60%),
                             radial-gradient(900px 500px at 110% 10%, rgba(240,180,41,.05), transparent 60%); }
    header { padding:14px 22px; border-bottom:1px solid var(--line);
            display:flex; align-items:center; gap:14px; background:rgba(10,13,18,.6);
            backdrop-filter: blur(8px); position:sticky; top:0; z-index:10; }
    header h1 { font-size:16px; margin:0; color:var(--acc); letter-spacing:2px; font-weight:700; }
    header .meta { color:var(--muted); font-size:12px; }
    header input { padding:8px 12px; border-radius:10px; border:1px solid var(--line);
                   background:#0d1117; color:var(--txt); width:280px; font-family:ui-monospace,monospace; font-size:12px;
                   transition: border-color .15s; }
    header input:focus { outline:none; border-color:var(--tip); }
    header button { padding:8px 16px; border:0; border-radius:10px; background:var(--acc);
                    color:#111; font-weight:700; cursor:pointer; font-size:12px;
                    transition: transform .08s, box-shadow .15s; }
    header button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(240,180,41,.25); }
    header button:active { transform: translateY(0); }
    .dot { display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:var(--muted);
           transition: background .2s, box-shadow .2s; }
    .dot.ok { background:var(--ok); box-shadow:0 0 0 3px rgba(63,185,80,.18); }
    .dot.bad { background:var(--bad); box-shadow:0 0 0 3px rgba(248,81,73,.18); }
    nav { display:flex; gap:6px; padding:10px 22px; border-bottom:1px solid var(--line);
          background:rgba(10,13,18,.6); backdrop-filter: blur(8px); position:sticky; top:57px; z-index:9; }
    nav button { padding:7px 14px; border:1px solid transparent; border-radius:8px;
                 background:transparent; color:var(--muted); cursor:pointer; font-size:13px;
                 transition: background .15s, color .15s, border-color .15s; }
    nav button:hover { color:var(--txt); background:rgba(255,255,255,.04); }
    nav button.active { background:var(--card); color:var(--txt); border-color:var(--line);
                        box-shadow: inset 0 -2px 0 var(--acc); }
    main { padding:18px 22px 60px; max-width:1400px; margin:0 auto; }
    .page-intro { color:var(--muted); font-size:13px; margin:0 0 14px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:14px; }
    .card { background:linear-gradient(180deg, var(--card), var(--card-2)); border:1px solid var(--line);
            border-radius:12px; padding:16px; box-shadow:var(--shadow); }
    .card h2 { margin:0 0 12px; font-size:13px; color:var(--muted); font-weight:600;
               letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
    .card h2 .h2-sub { color:var(--muted-2); font-weight:400; font-size:11px; }
    .card-head { display:flex; align-items:center; justify-content:space-between; gap:8px;
                 margin:0 0 12px; }
    .card-head h2 { margin:0; }
    .export-btn { padding:5px 12px; border:1px solid var(--line); border-radius:6px;
                  background:var(--card-2); color:var(--txt); font-size:11px;
                  font-weight:600; letter-spacing:.3px; cursor:pointer;
                  transition: background .15s, border-color .15s; }
    .export-btn:hover { background:rgba(88,166,255,.12); border-color:var(--tip); color:var(--tip); }
    .export-btn:active { transform: translateY(1px); }
    .cancel-btn { padding:4px 10px; border:1px solid rgba(248,81,73,.4); border-radius:6px;
                  background:transparent; color:var(--bad); font-size:11px;
                  font-weight:600; cursor:pointer; transition: background .15s, border-color .15s; }
    .cancel-btn:hover { background:rgba(248,81,73,.12); border-color:var(--bad); }
    .cancel-btn:active { transform: translateY(1px); }
    .row { display:flex; justify-content:space-between; align-items:baseline; padding:6px 0;
           border-bottom:1px dashed rgba(255,255,255,.04); gap:12px; }
    .row:last-child { border:0; }
    .row .k { color:var(--muted); display:inline-flex; align-items:center; gap:4px; }
    .row .v { font-family:ui-monospace,monospace; font-size:14px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left;
            font-family:ui-monospace,monospace; vertical-align: middle; }
    th { color:var(--muted); font-weight:500; font-size:11px; letter-spacing:.5px;
         text-transform: uppercase; background: rgba(255,255,255,.02); }
    tr.clickable { cursor:pointer; transition: background .12s; }
    tr.clickable:hover td { background:#1a2330; }
    tr.expanded td { background:#1a2330; border-bottom-color: transparent; }
    tr.detail-row td { background:#0e141d; padding:0; border-bottom:1px solid var(--line); }
    .pill { display:inline-block; padding:3px 8px; border-radius:6px; font-size:11px;
            font-weight:600; letter-spacing:.3px; }
    .pill.ok { background:rgba(63,185,80,.16); color:var(--ok); }
    .pill.bad { background:rgba(248,81,73,.16); color:var(--bad); }
    .pill.tip { background:rgba(88,166,255,.16); color:var(--tip); }
    .pill.acc { background:rgba(240,180,41,.16); color:var(--acc); }
    .pill.vio { background:rgba(188,140,255,.16); color:var(--vio); }
    .pill.muted { background:rgba(255,255,255,.06); color:var(--muted); }
    pre { margin:0; padding:10px 12px; background:#0a0d12; border-radius:8px; font-size:11px;
          max-height:240px; overflow:auto; border:1px solid var(--line); font-family: ui-monospace, monospace; }
    .empty { color:var(--muted); padding:24px 12px; text-align:center; font-style:normal;
             background:rgba(255,255,255,.02); border:1px dashed var(--line); border-radius:10px; }
    .empty .empty-title { color:var(--txt); font-size:14px; margin-bottom:6px; }
    .empty .empty-hint { font-size:12px; color:var(--muted-2); }
    .err { color:var(--bad); padding:14px 16px; background:rgba(248,81,73,.08);
           border:1px solid rgba(248,81,73,.3); border-radius:10px; }
    .err .err-hint { color:var(--muted); font-size:12px; margin-top:6px; }
    .log { font-family:ui-monospace,monospace; font-size:11px; padding:7px 10px;
           border-bottom:1px solid #1f242c; display:flex; gap:10px; align-items:center; }
    .log:hover { background:rgba(255,255,255,.03); }
    .log .ts { color:var(--muted); white-space:nowrap; }
    .log .topic { font-weight:700; min-width:64px; text-transform: uppercase; font-size:10px; }
    .log .topic.signal { color:var(--acc); }
    .log .topic.fill   { color:var(--ok); }
    .log .topic.equity { color:var(--tip); }
    .log .topic.healthz{ color:var(--vio); }
    .log .topic.ai     { color:#ff7b72; }
    .log .body { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
    .stat { display:flex; gap:24px; flex-wrap:wrap; }
    .stat .item { display:flex; flex-direction:column; gap:2px; }
    .stat .item .lbl { color:var(--muted); font-size:11px; display:inline-flex; align-items:center; gap:4px; }
    .stat .item .val { font-family:ui-monospace,monospace; font-size:22px; font-weight:700; letter-spacing:.5px; }
    .stat .item .sub { color:var(--muted-2); font-size:11px; }
    .pos { color:var(--ok); }
    .neg { color:var(--bad); }
    .foot { color:var(--muted-2); font-size:11px; padding:18px 22px;
            border-top:1px solid var(--line); text-align:center; margin-top:32px; }
    .toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
    .toolbar input, .toolbar select { background:#0d1117; border:1px solid var(--line); color:var(--txt);
                       padding:7px 10px; border-radius:8px; font-size:12px;
                       font-family:ui-monospace,monospace; }
    .toolbar input:focus, .toolbar select:focus { outline:none; border-color:var(--tip); }
    .toolbar button { padding:7px 14px; border:0; border-radius:8px; background:var(--tip);
                      color:#0b0f15; font-weight:700; font-size:12px; cursor:pointer;
                      transition: transform .08s, box-shadow .15s; }
    .toolbar button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(88,166,255,.25); }
    .toolbar button.alt { background:var(--card-2); color:var(--txt); border:1px solid var(--line); }
    .toolbar .spacer { flex:1; }
    .toolbar .meta { color:var(--muted); font-size:12px; }
    /* tooltips */
    .q { display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px;
         border-radius:50%; background:rgba(255,255,255,.08); color:var(--muted-2); font-size:10px;
         cursor:help; font-style:normal; font-weight:700; margin-left:4px;
         transition: background .15s, color .15s; position:relative; }
    .q:hover { background:rgba(88,166,255,.18); color:var(--tip); }
    .q[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      background:#0a0d12; color:var(--txt); border:1px solid var(--line);
      padding:8px 10px; border-radius:8px; font-size:12px; font-weight:400;
      white-space: normal; max-width: 280px; width: max-content; line-height:1.4;
      box-shadow: var(--shadow); z-index: 100; pointer-events:none;
    }
    .q[data-tip]:hover::before {
      content: ""; position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%);
      border:6px solid transparent; border-top-color: var(--line); z-index:100;
    }
    /* perf bars */
    .perf-row { display:grid; grid-template-columns: 56px 56px 1fr; gap:8px;
                align-items:center; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,.04); }
    .perf-row:last-child { border:0; }
    .perf-row .label { font-size:12px; color:var(--muted); }
    .perf-row .value { font-family:ui-monospace,monospace; font-size:13px; font-weight:600; text-align:right; }
    .perf-bar { height:10px; background:rgba(255,255,255,.04); border-radius:6px; overflow:hidden;
                position:relative; }
    .perf-bar .fill { height:100%; border-radius:6px; transition: width .3s ease; }
    .perf-bar .fill.pos { background: linear-gradient(90deg, #2ea043, #3fb950); }
    .perf-bar .fill.neg { background: linear-gradient(90deg, #da3633, #f85149); }
    .perf-bar .fill.zero { background: var(--muted-2); }
    /* signal detail panel */
    .detail-panel { padding:16px; background:#0e141d; border-radius:8px; margin:6px 12px 12px; }
    .detail-panel h3 { margin:0 0 8px; font-size:13px; color:var(--muted); font-weight:600; }
    .detail-panel .factor-list { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
    .factor { display:inline-flex; align-items:center; gap:4px; padding:4px 8px;
              border-radius:6px; background:rgba(255,255,255,.04); font-size:11px;
              font-family: ui-monospace,monospace; color:var(--muted); }
    .factor .w { color:var(--acc); font-weight:700; }
    .factor .d { color:var(--muted-2); }
    .perf-grid { display:grid; grid-template-columns: repeat(5, 1fr); gap:8px; margin-top:6px; }
    .perf-grid .cell { padding:8px; background:rgba(255,255,255,.03); border-radius:6px; text-align:center; }
    .perf-grid .cell .w { font-size:11px; color:var(--muted); margin-bottom:2px; }
    .perf-grid .cell .r { font-family:ui-monospace,monospace; font-size:13px; font-weight:700; }
    .perf-grid .cell.pending .r { color:var(--muted-2); }
    @media (max-width: 760px) {
      header { align-items:stretch; flex-wrap:wrap; }
      header input { width:min(100%, 360px); flex:1; }
      nav { overflow-x:auto; top:99px; }
      nav button { white-space:nowrap; }
      main { padding:12px; }
      .perf-grid { grid-template-columns: repeat(2, 1fr); }
      .card { overflow-x:auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>摸金小王子</h1>
    <span id="clientKind" class="meta">复盘工作台</span>
    <input id="base" value="http://127.0.0.1:8787" placeholder="服务地址，例如 http://127.0.0.1:8787" />
    <button id="btnConnect">连接</button>
    <span class="meta"><span id="dot" class="dot"></span><span id="status">离线</span></span>
  </header>

  <nav id="nav">
    <button data-tab="dashboard" class="active">总览</button>
    <button data-tab="universe">自选/扫描</button>
    <button data-tab="account">账户/持仓</button>
    <button data-tab="risk">风险中心</button>
    <button data-tab="fills">成交</button>
    <button data-tab="signals">信号</button>
    <button data-tab="performance">后验</button>
    <button data-tab="ai">AI 仲裁</button>
    <button data-tab="indices">指数池</button>
    <button data-tab="brief">每日复盘</button>
    <button data-tab="wslog">WS 日志</button>
  </nav>

  <main id="main"></main>

  <div class="foot">家庭自用 · 纸上统计 · 不构成投资建议</div>

  <script>
    const $ = (id) => document.getElementById(id);
    const TABS = ["dashboard", "universe", "account", "fills", "signals", "performance", "ai", "indices", "brief", "wslog"];
    const STORAGE_KEY = "mojin.desktop.baseUrl";
    let BASE = "http://127.0.0.1:8787";
    let ws = null;
    let wsGeneration = 0;
    let reconnectTimer = null;
    let wsLog = [];
    const MAX_WS = 100;
    let lastHealthz = null;
    let lastEquity = null;
    let snapshotStatus = "";
    let researchResult = null;
    let orderDraft = null;
    let universeGroup = "全部";
    let universeStatus = "";
    // 指数池 tab 本地状态
    let indexStatus = "";
    // 复盘 tab 状态
    let briefText = "";
    let briefCopyStatus = "";
    // 信号 tab 本地状态
    let signalFilter = { levels: new Set(["risk","confirm","strong","tip"]), code: "" };
    let expandedSignalId = null;
    let signalDetailCache = {}; // id -> { signal, perf, factors }

    /* ---------- 解释器 ---------- */
    const TIPS = {
      equity: "账户总价值 = 可用现金 + 持仓市值（含未标记行情按成本）。",
      cash: "没有下进冻结单的现金。",
      frozen: "已经下单但还没成交、被锁住的现金。",
      market_value: "按当前行情算出来的持仓总市值。",
      unpriced_positions: "还没拿到最新行情、暂用成本估值的持仓数。点『刷新估值』重新抓。",
      hit_rate: "在某个时间窗口（比如 5 日）后盈利的信号占比。50% 算跑赢掷硬币。",
      avg_return: "该窗口下所有样本的平均涨跌幅。",
      best: "该窗口下表现最好的那一次。",
      worst: "该窗口下表现最差的那一次。",
      samples: "参与统计的信号数量。少于 20 几乎没参考价值。",
      signals: "数据库里保存的总信号条数。",
      signals_labeled: "已经有 N 日后实际收益记录的信号数，可以用来算胜率。",
      schema: "数据库结构版本，跟服务一起发布。",
      level_risk: "风险：提示下跌或破位信号，可能要减仓回避。",
      level_confirm: "确认：多个指标一起印证，方向较为明确。",
      level_strong: "强信号：多个高权重因子同向，置信度更高。",
      level_tip: "提示：单一指标触发，仅供观察。",
      confidence: "置信度：服务对这条信号强度的自评（0–100%）。",
      snapshot: "把当前所有持仓的行情快照保存到权益曲线里。",
      tokens_in: "AI 输入的 token 数。本地启发式默认 0。",
      tokens_out: "AI 输出的 token 数。本地启发式默认 0。",
      cost_estimate: "按模型计费折算的成本，本地启发式一律 0。",
      ws_clients: "当前在线的 WS 客户端数。",
      topics: "已经订阅的事件主题。",
      ws_log: "WS 实时事件流。signal=新信号 / fill=成交 / equity=权益推送 / healthz=健康 / ai=AI 调用。",
    };
    function tip(key) {
      const t = TIPS[key] || "";
      return `<i class="q" data-tip="${esc(t)}">?</i>`;
    }

    function normalizeBase(raw) {
      const value = String(raw || "").trim().replace(/\/$/, "");
      const parsed = new URL(value);
      if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
        throw new Error("服务地址必须使用 http:// 或 https://");
      }
      return value;
    }

    function applyBase(raw) {
      BASE = normalizeBase(raw);
      $("base").value = BASE;
      localStorage.setItem(STORAGE_KEY, BASE);
    }

    /* ---------- HTTP ---------- */
    async function api(path) {
      const res = await fetch(BASE + path, { headers: { "Accept": "application/json" } });
      if (!res.ok) throw new Error(path + " → " + res.status);
      return res.json();
    }

    async function apiRequest(path, method, body) {
      const options = { method, headers: { "Accept": "application/json" } };
      if (body !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      const res = await fetch(BASE + path, options);
      let data = null;
      try { data = await res.json(); } catch { /* keep HTTP status below */ }
      if (!res.ok || data?.ok === false) throw new Error(data?.error || `${path} → ${res.status}`);
      return data;
    }

    /* ---------- CSV 导出 ----------
     * 走浏览器原生下载：动态建一个 <a download> 触发。
     * Tauri WebView 在 macOS 上把文件落到默认下载目录（~/Downloads）。
     * 不走 Blob+fetch：WKWebView/Wry 默认不弹保存对话框，会试图 navigate 到 csv 链接。
     */
    function pad2(n) { return String(n).padStart(2, "0"); }
    function exportFilename(prefix, ext = "csv") {
      const d = new Date();
      return `${prefix}-${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.${ext}`;
    }
    function exportCsv(path) {
      // url 加 cache buster，避免某些 webview 缓存 CSV
      const url = BASE + path + (path.includes("?") ? "&" : "?") + "_t=" + Date.now();
      const a = document.createElement("a");
      a.href = url;
      a.download = ""; // 让后端 Content-Disposition 决定文件名
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => a.remove(), 100);
    }

    async function apiOrError(path) {
      try { return { ok: true, data: await api(path) }; }
      catch (e) { return { ok: false, error: String(e) }; }
    }
    function errHint(path, err) {
      // 给常见错误出修复提示
      const m = String(err || "");
      if (/Failed to fetch|NetworkError|Load failed/i.test(m)) {
        return "服务连不上。先确认 ./scripts/dev-up.sh 已启动，或者顶部地址是不是错的（默认 http://127.0.0.1:8787）。";
      }
      if (/404/.test(m)) return "接口 " + path + " 在当前版本里不存在，可能服务版本不匹配。";
      if (/500|502|503/.test(m)) return "服务内部错误，去看 mj-server 日志。";
      return m;
    }

    /* ---------- WS ---------- */
    function connectWs() {
      const generation = ++wsGeneration;
      clearTimeout(reconnectTimer);
      try {
        if (ws) {
          ws.onclose = null;
          ws.close();
        }
        const u = BASE.replace(/^http/, "ws") + "/ws";
        ws = new WebSocket(u);
        $("status").textContent = "连接中…";
        $("dot").className = "dot";
        // onerror 在每次重连时一定会先 fire 一次（浏览器规范），紧跟 close。
        // 这里只更新视觉但不改成"错误"文案，避免在 onopen 之后才到达的
        // error 事件把"WS 已连接"覆盖掉；真正的状态由 onopen/onclose 管理。
        ws.onerror = () => { $("dot").className = "dot"; };
        ws.onopen = () => {
          $("status").textContent = "WS 已连接";
          $("dot").className = "dot ok";
          ws.send(JSON.stringify({
            action: "subscribe",
            topics: ["signal", "fill", "equity", "healthz", "ai"]
          }));
        };
        ws.onclose = () => {
          if (generation !== wsGeneration) return;
          $("status").textContent = "WS 断开，3 秒后重连";
          $("dot").className = "dot bad";
          reconnectTimer = setTimeout(connectWs, 3000);
        };
        ws.onmessage = (e) => {
          try {
            const ev = JSON.parse(e.data);
            wsLog.unshift({ ts: ev.ts || new Date().toISOString(), topic: ev.topic, body: JSON.stringify(ev.payload).slice(0, 240) });
            if (wsLog.length > MAX_WS) wsLog = wsLog.slice(0, MAX_WS);
            if (ev.topic === "healthz") lastHealthz = ev.payload;
            if (ev.topic === "equity") lastEquity = ev.payload;
            // 当前 tab 是 wslog 或 dashboard 时刷新
            if (currentTab === "wslog" || currentTab === "dashboard") render();

    let currentTab = "dashboard";

    async function loadAll() {
      const results = await Promise.all([
        apiOrError("/healthz"),
        apiOrError("/api/v1/paper/account"),
        apiOrError("/api/v1/signals"),
        apiOrError("/api/v1/performance?days=5&limit=200"),
        apiOrError("/api/v1/paper/orders?limit=20"),
      ]);
      const [h, a, s, p, o] = results;
      return {
        errors: results.filter(r => !r.ok).map(r => r.error),
        healthz: h.ok ? h.data : null,
        account: a.ok ? a.data : null,
        signals: s.ok ? (s.data.signals || []) : [],
        perf: p.ok ? p.data : null,
        orders: o.ok ? (o.data.orders || []) : [],
      };
    }

    function fmtPct(x) {
      if (x === null || x === undefined) return "—";
      return (x >= 0 ? "+" : "") + (x * 100).toFixed(2) + "%";
    }
    function fmtNum(x) { return x === null || x === undefined ? "—" : Number(x).toFixed(2); }
    function esc(x) { return String(x ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
    function fmtTs(t) {
      if (!t) return "";
      try { return new Date(t).toLocaleTimeString(); } catch { return t; }
    }

    function pillFor(level) {
      const m = { risk: "bad", confirm: "tip", strong: "ok", tip: "acc" };
      const cls = m[level] || "acc";
      const tipKey = "level_" + level;
      return `<span class="pill ${cls}">${esc(level)}</span>${tip(tipKey)}`;
    }

    function emptyBlock(title, hint, action) {
      return `<div class="empty">
        <div class="empty-title">${esc(title)}</div>
        <div class="empty-hint">${esc(hint)}${action ? `<br><br>${action}` : ""}</div>
      </div>`;
    }
    function errBlock(path, err) {
      return `<div class="err">
        <div><b>${esc(path)}</b> 加载失败</div>
        <div class="err-hint">${esc(errHint(path, err))}</div>
      </div>`;
    }

        <div class="card">
          <h2>Markdown 预览</h2>
          <pre id="briefPreview" style="white-space:pre-wrap;max-height:60vh;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.5">${esc(md)}</pre>
        </div>
      `;
    }

    function buildBriefMarkdown({ account, fills, signals, perf, research, errs }) {
      const lines = [];
      const now = new Date();
      const dStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
      lines.push(`# 每日复盘 · ${dStr}`);
      lines.push("");
      if (errs.length) {
        lines.push(`> 部分数据缺失：${errs.join("；")}`);
        lines.push("");
      }
      // 海外市场与行业
      const usMarket = research?.us_market || [];
      lines.push("## 昨日美股");
      if (usMarket.length) {
        for (const m of usMarket) lines.push(`- ${m.name}（${m.session_date}）：${Number(m.change_pct) >= 0 ? "+" : ""}${Number(m.change_pct).toFixed(2)}%`);
      } else lines.push("- 暂无可用数据");
      lines.push("");
      const sectors = research?.sectors || [];
      lines.push("## A 股行业强弱");
      if (sectors.length) {
        for (const s of sectors.slice(0, 8)) lines.push(`- ${s.name}：${Number(s.change_pct) >= 0 ? "+" : ""}${Number(s.change_pct).toFixed(2)}%`);
      } else lines.push("- 暂无可用数据");
      lines.push("");
      // 账户
      if (account) {
        const a = account;
        lines.push("## 账户概览");
        lines.push(`- 现金：${a.cash ?? "—"}`);
        lines.push(`- 冻结：${a.frozen ?? "—"}`);
        lines.push(`- 市值：${a.market_value ?? "—"}`);
        lines.push(`- 权益：${a.equity ?? "—"}`);
        const pos = a.positions || [];
        lines.push(`- 持仓数：${pos.length}`);
        lines.push("");
        if (pos.length) {
          lines.push("### 持仓");
          lines.push("| 代码 | 数量 | 成本 | 现价 | 浮动盈亏 |");
          lines.push("|---|---|---|---|---|");
          for (const p of pos) {
            const mv = (p.market_price != null) ? Number(p.market_price).toFixed(4) : "—";
            const upl = p.market_price == null ? "—" : (Number(p.market_value) - Number(p.cost)).toFixed(2);
            lines.push(`| ${p.code} | ${p.qty} | ${Number(p.avg_cost ?? 0).toFixed(4)} | ${mv} | ${upl} |`);
          }
          lines.push("");
        }
      } else {
        lines.push("## 账户概览");
        lines.push("（无数据）");
        lines.push("");
      }
      // 信号
      if (signals.length) {
        const counts = {};
        for (const s of signals) counts[s.level] = (counts[s.level] || 0) + 1;
        lines.push("## 信号汇总");
        lines.push(`- 共 ${signals.length} 条`);
        for (const k of Object.keys(counts)) lines.push(`- ${k}: ${counts[k]}`);
        const strong = signals.filter(s => s.level === "strong" || s.level === "confirm").slice(0, 5);
        if (strong.length) {
          lines.push("");
          lines.push("### 重点信号");
          for (const s of strong) lines.push(`- ${s.fired_at || ""} · ${s.code} ${s.name || ""} · ${s.level} · ${s.confidence ?? "?"}`);
        }
        lines.push("");
      }
      // 成交（最近 N）
      if (fills.length) {
        lines.push("## 最近成交");
        lines.push("| 时间 | 代码 | 方向 | 数量 | 价格 | 费用 |");
        lines.push("|---|---|---|---|---|---|");
        for (const f of fills.slice(0, 20)) {
          const fee = (f.commission + f.stamp_tax + f.transfer_fee).toFixed(2);
          lines.push(`| ${(f.filled_at || "").slice(0,16)} | ${f.code} | ${f.side} | ${f.qty} | ${f.price} | ${fee} |`);
        }
        lines.push("");
      }
      // 后验
      if (perf && perf.stats) {
        const s = perf.stats;
        lines.push("## 后验指标");
        lines.push(`- 窗口：${s.window} 天，样本：${s.samples}`);
        lines.push(`- 命中率：${s.hit_rate == null ? "—" : (s.hit_rate * 100).toFixed(1) + "%"}`);
        lines.push(`- 平均收益：${fmtPct(s.avg_return)}`);
        lines.push(`- 最佳：${fmtPct(s.best)}`);
        lines.push(`- 最差：${fmtPct(s.worst)}`);
        if (perf.windows && perf.windows.length) {
          lines.push("");
          lines.push("### 多窗口");
          lines.push("| 窗口 | 样本 | 命中率 | 平均收益 |");
          lines.push("|---|---|---|---|");
          for (const w of perf.windows) {
            lines.push(`| ${w.window}d | ${w.samples} | ${w.hit_rate == null ? "—" : (w.hit_rate*100).toFixed(1) + "%"} | ${fmtPct(w.avg_return)} |`);
          }
        }
        lines.push("");
      }
      const sourceErrors = research?.errors || [];
      if (sourceErrors.length) {
        lines.push("## 数据提醒");
        for (const error of sourceErrors) lines.push(`- ${error}`);
        lines.push("");
      }
      lines.push("---");
      lines.push("生成时间：" + now.toLocaleString());
      lines.push("家庭自用 · 不构成投资建议");
      return lines.join("\n");
    }

    /* 成交 */
    async function renderFills() {
      const r = await apiOrError("/api/v1/paper/fills?limit=200");
      if (!r.ok) return errBlock("/api/v1/paper/fills", r.error);
      const fills = r.data.fills || [];
      // 汇总：按代码聚合买入/卖出数量 + 净持仓
      const summary = {};
      for (const f of fills) {
        const k = f.code;
        if (!summary[k]) summary[k] = { code: k, buy: 0, sell: 0, buyAmt: 0, sellAmt: 0, fee: 0 };
        if (f.side === "buy") {
          summary[k].buy += f.qty;
          summary[k].buyAmt += f.qty * f.price;
        } else {
          summary[k].sell += f.qty;
          summary[k].sellAmt += f.qty * f.price;
        }
        summary[k].fee += (f.commission + f.stamp_tax + f.transfer_fee);
      }
      const summaryRows = Object.values(summary)
        .map(s => ({
          ...s,
          net: s.buy - s.sell,
          avgBuy: s.buy > 0 ? s.buyAmt / s.buy : 0,
        }))
        .sort((a, b) => b.net - a.net);
      return `
        <p class="page-intro">模拟盘成交明细。买/卖费用已并入；底部汇总按代码聚合净持仓与累计费用。</p>
        <div class="card" style="margin-bottom:14px">
          <div class="card-head">
            <h2>成交明细 <span class="h2-sub">${fills.length} 笔</span></h2>
            <button class="export-btn" data-export-path="/api/v1/export/fills.csv?limit=2000">导出 CSV</button>
          </div>
          ${fills.length === 0
            ? emptyBlock("暂无成交", "去账户/持仓 tab 下一笔模拟单试试。")
            : `<table>
              <thead><tr><th>时间</th><th>代码</th><th>方向</th><th>数量</th><th>价格</th><th>金额</th><th>佣金</th><th>印花税</th><th>过户费</th></tr></thead>
              <tbody>${fills.map(f => `
                <tr>
                  <td><span class="meta">${esc(fmtTs(f.filled_at))}</span></td>
                  <td>${esc(f.code)}</td>
                  <td><span class="pill ${f.side === "buy" ? "ok" : "bad"}">${f.side === "buy" ? "买" : "卖"}</span></td>
                  <td>${f.qty}</td>
                  <td>${fmtNum(f.price)}</td>
                  <td>${fmtNum(f.qty * f.price)}</td>
                  <td>${fmtNum(f.commission)}</td>
                  <td>${fmtNum(f.stamp_tax)}</td>
                  <td>${fmtNum(f.transfer_fee)}</td>
                </tr>`).join("")}
              </tbody>
            </table>`}
        </div>
        <div class="card">
          <h2>按代码汇总</h2>
          ${summaryRows.length === 0
            ? emptyBlock("暂无汇总", "还没有成交数据。")
            : `<table>
              <thead><tr><th>代码</th><th>买入</th><th>卖出</th><th>净持仓</th><th>买入均价</th><th>累计费用</th></tr></thead>
              <tbody>${summaryRows.map(s => `
                <tr>
                  <td>${esc(s.code)}</td>
                  <td>${s.buy}</td>
                  <td>${s.sell}</td>
                  <td class="${s.net > 0 ? "pos" : s.net < 0 ? "neg" : ""}">${s.net}</td>
                  <td>${s.avgBuy > 0 ? fmtNum(s.avgBuy) : "—"}</td>
                  <td>${fmtNum(s.fee)}</td>
                </tr>`).join("")}
              </tbody>
            </table>`}
        </div>
      `;
    }

    /* 信号 */
    function renderSignals(d) {
      if (!d.healthz) return errBlock("/api/v1/signals", d.errors[0] || "未知");
      const sigs = d.signals || [];
      const filtered = sigs.filter(s => signalFilter.levels.has(s.level) &&
        (!signalFilter.code || (s.code + " " + (s.name||"")).toLowerCase().includes(signalFilter.code.toLowerCase())));
      const levels = ["risk","confirm","strong","tip"];
      const levelLabels = { risk:"风险", confirm:"确认", strong:"强", tip:"提示" };
      return `
        <p class="page-intro">最近 50 条技术信号。点击行看因子与后验；上面可以按等级和代码过滤。</p>
        <div class="toolbar">
          <span class="meta">等级：</span>
          ${levels.map(l => `
            <button class="alt ${signalFilter.levels.has(l) ? 'active' : ''}" data-lvl="${l}"
              style="${signalFilter.levels.has(l) ? '' : 'opacity:.45'}; margin-right:-4px;">
              ${levelLabels[l]}${tip("level_" + l)}
            </button>`).join("")}
          <input id="signalCodeFilter" placeholder="代码/名称（包含）" value="${esc(signalFilter.code)}" style="width:160px"/>
          <span class="spacer"></span>
          <span class="meta">${filtered.length} / ${sigs.length} 条</span>

            <button class="export-btn" data-export-path="/api/v1/export/signals.csv?limit=2000">导出 CSV</button>
          </div>
          ${filtered.length === 0
            ? emptyBlock(sigs.length === 0 ? "暂无信号" : "过滤后为空", sigs.length === 0 ? "后端跑过 evaluate 或 scan 后才会有。" : "把过滤条件放宽试试。")
            : `<table>
              <thead><tr><th>时间</th><th>代码</th><th>名称</th><th>等级</th><th>置信${tip("confidence")}</th><th>价格</th><th>标题</th></tr></thead>

    function renderSignalRow(s) {
      const expanded = expandedSignalId === s.id;
      const cached = signalDetailCache[s.id];
      const main = `
        <tr class="clickable ${expanded ? 'expanded' : ''}" data-signal="${esc(s.id)}">
          <td>${esc(fmtTs(s.fired_at))}</td>
          <td>${esc(s.code)}</td>
          <td>${esc(s.name)}</td>
          <td>${pillFor(s.level)}</td>
          <td>${(s.confidence*100).toFixed(0)}%</td>
          <td>${fmtNum(s.price)}</td>
          <td>${esc(s.title)}</td>
        </tr>`;
      if (!expanded) return main;
      const detail = `
        <tr class="detail-row"><td colspan="7">
          ${cached ? renderSignalDetail(cached) : '<div class="empty"><div class="empty-hint">加载详情中…</div></div>'}

    function renderSignalDetail(d) {
      const perf = d.perf;
      const cells = [1, 3, 5, 10, 20].map(w => {
        const k = "ret_" + w + "d";
        const v = perf ? perf[k] : null;
        if (perf && perf.pending && perf.pending.includes(w)) {
          return `<div class="cell pending"><div class="w">${w} 日</div><div class="r">尚未到期</div></div>`;
        }
        return `<div class="cell"><div class="w">${w} 日</div><div class="r ${v > 0 ? 'pos' : v < 0 ? 'neg' : ''}">${fmtPct(v)}</div></div>`;
      }).join("");
      const factors = (d.factors || []);
      return `<div class="detail-panel">
        <h3>触发因子</h3>
        ${factors.length === 0
          ? '<div class="empty-hint">该信号没有记录因子（老数据或手动写入）。</div>'
          : `<div class="factor-list">${factors.map(f => `
              <span class="factor"><span class="w">+${esc(f.weight.toFixed(1))}</span>${esc(f.key)}${f.detail ? `<span class="d">· ${esc(f.detail)}</span>` : ""}</span>
            `).join("")}</div>`}
        <h3>后验收益${tip("hit_rate")}</h3>
        <div class="perf-grid">${cells}</div>
        ${perf && perf.labeled_at ? `<div class="meta" style="margin-top:8px">最近一次回填：${esc(fmtTs(perf.labeled_at))}</div>` : ""}
      </div>`;

    async function loadSignalDetail(id) {
      if (signalDetailCache[id]) return signalDetailCache[id];
      try {
        const j = await api("/api/v1/signal/" + encodeURIComponent(id));
        signalDetailCache[id] = j;
        return j;
      } catch (e) {
        signalDetailCache[id] = { error: String(e) };
        return signalDetailCache[id];
      }
    }

    /* 后验 */
    async function renderPerformance() {
      const r = await apiOrError("/api/v1/performance?days=5&limit=200");
      if (!r.ok) return errBlock("/api/v1/performance", r.error);
      const ws = r.data.windows || [];
      // 取最大绝对值做柱状图比例尺
      const maxAbs = Math.max(0.001, ...ws.map(w => Math.max(Math.abs(w.avg_return || 0), Math.abs(w.best || 0), Math.abs(w.worst || 0))));
      const rows = ws.map(w => {
        const avg = w.avg_return;
        const isPos = avg > 0;
        const isNeg = avg < 0;
        const width = Math.min(100, Math.abs(avg || 0) / maxAbs * 100);
        const cls = isPos ? "pos" : isNeg ? "neg" : "zero";
        return `<div class="perf-row">
          <span class="label">${w.window} 日</span>
          <span class="value ${isPos ? 'pos' : isNeg ? 'neg' : ''}">${fmtPct(avg)}</span>
          <div class="perf-bar"><div class="fill ${cls}" style="width:${width.toFixed(1)}%"></div></div>
        </div>`;
      }).join("");
      const stats = r.data.stats;
      return `
        <p class="page-intro">按窗口看历史信号的平均表现。柱越长，绝对收益越大。颜色只表示方向，不代表好坏。</p>
        <div class="card" style="margin-bottom:14px">
          <h2>主窗口（${stats?.days ?? 5} 日）${tip("hit_rate")}</h2>
          ${stats ? `
            <div class="stat">
              <div class="item"><span class="lbl">样本${tip("samples")}</span><span class="val">${stats.samples}</span></div>
              <div class="item"><span class="lbl">胜率</span><span class="val">${stats.hit_rate === null ? "—" : (stats.hit_rate*100).toFixed(1)+"%"}</span></div>
              <div class="item"><span class="lbl">平均</span><span class="val pos">${fmtPct(stats.avg_return)}</span></div>
              <div class="item"><span class="lbl">最好</span><span class="val pos">${fmtPct(stats.best)}</span></div>
              <div class="item"><span class="lbl">最差</span><span class="val neg">${fmtPct(stats.worst)}</span></div>
            </div>
          ` : emptyBlock("暂无样本", "需要 confirm／strong 等级的信号并走完后验。")}
        </div>
        <div class="card">
          <div class="card-head">
            <h2>多窗口柱状图</h2>
            <button class="export-btn" data-export-path="/api/v1/export/pnl.csv?limit=2000">导出权益 CSV</button>
          </div>
          ${ws.length === 0 ? emptyBlock("暂无窗口", "样本不足时会留空。") : `
            <div class="perf-row" style="border:0">
              <span class="label">窗口</span><span class="value">平均</span><span></span>
            </div>
            ${rows}
          `}
        </div>
      `;
    }

    function renderResearchResult() {
      if (!researchResult) return "";
      const data = researchResult;
      const context = data.context || {};
      const candidates = data.candidates || [];
      const market = context.us_market || [];
      const sectors = context.sectors || [];
      const news = context.news || [];
      const verdictLevel = (verdict) => verdict === "buy" ? "strong" : verdict === "sell" ? "risk" : "tip";
      return `
        <div class="card" style="margin-top:14px">
          <h2>研究候选 <span class="h2-sub">${esc(new Date(data.as_of).toLocaleString())}</span></h2>
          ${candidates.length === 0 ? emptyBlock("没有可用候选", "检查代码格式、后端网络和行情源。") : `
            <table><thead><tr><th>排名</th><th>代码</th><th>名称</th><th>价格</th><th>结论</th><th>得分</th><th>置信</th><th>五角色快览</th></tr></thead>
            <tbody>${candidates.map((c, index) => {
              const plan = c.risk_plan || {};
              const roleCells = (c.roles || []).map(r => {
                const cls = r.score > 0.05 ? "pos" : r.score < -0.05 ? "neg" : "";
                const tag = {technician:"技",fundamental:"基",risk:"险",position:"仓",psychology:"心"}[r.role] || r.role;
                return `<span class="factor" title="${esc(r.body)}"><span class="w" style="color:${r.score > 0 ? 'var(--ok)' : r.score < 0 ? 'var(--bad)' : 'var(--muted)'}">${tag} ${r.score >= 0 ? "+" : ""}${r.score.toFixed(2)}</span></span>`;
              }).join("");
              return `<tr>
              <td>${index + 1}</td><td>${esc(c.code)}</td><td>${esc(c.name)}</td><td>${fmtNum(c.price)}</td>
              <td>${pillFor(verdictLevel(c.verdict))} ${esc(c.verdict)}

    /* WS 日志 */
    function renderWsLog() {
      if (wsLog.length === 0) {
        return `<p class="page-intro">WS 实时事件流${tip("ws_log")}。连上服务后等推送即可。</p>
          <div class="card">${emptyBlock("暂无事件", "确认顶部状态点是否变绿；没变说明 WS 没连上。")}</div>`;
      }
      return `
        <p class="page-intro">WS 实时事件流${tip("ws_log")}。新→旧，最近 ${wsLog.length} 条。</p>
        <div class="card">
          ${wsLog.map(l => `
            <div class="log">
              <span class="ts">${esc(fmtTs(l.ts))}</span>
              <span class="topic ${esc(l.topic)}">${esc(l.topic)}</span>
              <span class="body" title="${esc(l.body)}">${esc(l.body)}</span>
            </div>`).join("")}
        </div>
      `;
    }

    /* ---------- 主渲染 ---------- */
    async function render() {
      const version = ++renderVersion;
      const tabName = currentTab;
      $("main").innerHTML = `<div class="empty"><div class="empty-hint">加载中…</div></div>`;
      let html = "";
      if (tabName === "dashboard" || tabName === "account" || tabName === "signals") {
        const d = await loadAll();
        if (version !== renderVersion) return;
        if (tabName === "dashboard") html = renderDashboard(d);
        else if (tabName === "account") html = renderAccount(d);
        else if (tabName === "signals") html = renderSignals(d);
      } else if (tabName === "universe") {
        html = await renderUniverse();
      } else if (tabName === "fills") {
        html = await renderFills();
      } else if (tabName === "risk") {
        html = await renderRisk();
      } else if (tabName === "performance") {
        html = await renderPerformance();
      } else if (tabName === "ai") {
        html = await renderAi();
      } else if (tabName === "indices") {
        html = await renderIndices();
      } else if (tabName === "brief") {
        html = await renderBrief();
      } else if (tabName === "wslog") {
        html = renderWsLog();
      }
      if (version !== renderVersion) return;
      $("main").innerHTML = html;
      bindHandlers();
    }

    function bindHandlers() {
      // 指数池
      const indexAddBtn = document.getElementById("indexAdd");
      if (indexAddBtn) indexAddBtn.onclick = runIndexAdd;
      document.querySelectorAll("[data-index-del]").forEach(b => {
        b.onclick = () => runIndexDelete(b.getAttribute("data-index-del"));
      });
      document.querySelectorAll("[data-index-toggle]").forEach(b => {
        b.onclick = () => runIndexToggle(b.getAttribute("data-index-toggle"), b.getAttribute("data-index-enabled") === "true");
      });
      // 复盘
      const briefRegen = document.getElementById("briefRegen");
      if (briefRegen) briefRegen.onclick = () => { briefText = ""; briefCopyStatus = ""; render(); };
      const briefCopy = document.getElementById("briefCopy");
      if (briefCopy) briefCopy.onclick = runBriefCopy;
      const briefDownload = document.getElementById("briefDownload");
      if (briefDownload) briefDownload.onclick = runBriefDownload;
      // AI 按钮绑定
      const goBtn = document.getElementById("aiGo");
      if (goBtn) goBtn.onclick = runAnalyze;
      const researchBtn = document.getElementById("researchGo");
      if (researchBtn) researchBtn.onclick = runResearchSelect;
      const markBtn = document.getElementById("refreshValuation");
      if (markBtn) markBtn.onclick = runSnapshot;
      const riskRefresh = document.getElementById("riskRefresh");
      if (riskRefresh) riskRefresh.onclick = render;

      const watchAddBtn = document.getElementById("watchAdd");
      if (watchAddBtn) watchAddBtn.onclick = runWatchAdd;
      const watchFilter = document.getElementById("watchGroupFilter");
      if (watchFilter) watchFilter.onchange = () => { universeGroup = watchFilter.value; render(); };
      const watchScanBtn = document.getElementById("watchScan");
      if (watchScanBtn) watchScanBtn.onclick = () => runWatchScan();
      const watchAiBtn = document.getElementById("watchAi");
      if (watchAiBtn) watchAiBtn.onclick = runWatchAi;
      document.querySelectorAll("[data-scan-code]").forEach(b => {
        b.onclick = () => runWatchScan([b.getAttribute("data-scan-code")]);
      });
      document.querySelectorAll("[data-watch-code]").forEach(b => {
        b.onclick = () => runWatchDelete(b.getAttribute("data-watch-group"), b.getAttribute("data-watch-code"));
      });
      document.querySelectorAll("[data-paper-code]").forEach(b => {
        b.onclick = () => stageResearchOrder(
          b.getAttribute("data-paper-code"),
          Number(b.getAttribute("data-paper-price")),
          Number(b.getAttribute("data-paper-qty")),
          Number(b.getAttribute("data-paper-stop")),
          Number(b.getAttribute("data-paper-target")),
          Number(b.getAttribute("data-paper-budget")),
          Number(b.getAttribute("data-paper-position")),
        );
      });
      document.querySelectorAll("[data-risk-sell]").forEach(b => {
        b.onclick = () => stageRiskSell(
          b.getAttribute("data-risk-sell"),
          Number(b.getAttribute("data-risk-price")),
          Number(b.getAttribute("data-risk-qty")),
        );
      });

      // 模拟下单
      const orderGoBtn = document.getElementById("orderGo");
      if (orderGoBtn) orderGoBtn.onclick = runSubmitOrder;

      // 撤单
      document.querySelectorAll(".cancel-btn[data-order-id]").forEach(b => {
        b.onclick = () => {
          const id = b.getAttribute("data-order-id");
          if (id) runCancelOrder(id);
        };
      });

      // 导出 CSV 按钮：data-export-path 指向后端 /api/v1/export/*.csv
      document.querySelectorAll("[data-export-path]").forEach(b => {
        b.onclick = (e) => {
          e.preventDefault();
          const path = b.getAttribute("data-export-path");
          if (path) exportCsv(path);
        };
      });

      // 信号 tab：等级筛选
      document.querySelectorAll("[data-lvl]").forEach(b => {
        b.onclick = () => {
          const l = b.dataset.lvl;
          if (signalFilter.levels.has(l)) signalFilter.levels.delete(l);
          else signalFilter.levels.add(l);
          if (signalFilter.levels.size === 0) signalFilter.levels = new Set(["risk","confirm","strong","tip"]);
          render();
        };
      });
      const codeInput = document.getElementById("signalCodeFilter");
      if (codeInput) {
        codeInput.oninput = (e) => { signalFilter.code = e.target.value; render(); };
      }

      // 信号 tab：点击行展开
      document.querySelectorAll("tr.clickable[data-signal]").forEach(tr => {
        tr.onclick = async () => {
          const id = tr.dataset.signal;
          if (expandedSignalId === id) {
            expandedSignalId = null;
          } else {
            expandedSignalId = id;
            await loadSignalDetail(id);
          }
          render();
        };
      });
    }

    async function currentWatchCodes() {
      const path = universeGroup === "全部" ? "/api/v1/watchlist" : "/api/v1/watchlist?group=" + encodeURIComponent(universeGroup);
      const data = await api(path);
      return [...new Set((data.items || []).map(x => x.code))];
    }

    /* ---------- 指数池动作 ---------- */
    async function runIndexAdd() {
      const code = $("indexCode").value.trim().toLowerCase();
      const name = $("indexName").value.trim();
      if (!/^(sh|sz|bj)\d{6}$/.test(code)) {
        indexStatus = "代码格式应为 sh/sz/bj + 6 位数字";
        await render();
        return;
      }
      try {
        await apiRequest("/api/v1/index-universe", "POST", { code, name, enabled: true });
        indexStatus = `${code} 已添加`;
        $("indexCode").value = "";
        $("indexName").value = "";
      } catch (e) { indexStatus = "添加失败：" + String(e); }
      await render();
    }

    async function runIndexDelete(code) {
      if (!confirm(`确认删除指数 ${code}？`)) return;
      try {
        await apiRequest(`/api/v1/index-universe/${encodeURIComponent(code)}`, "DELETE");
        indexStatus = `${code} 已删除`;
      } catch (e) { indexStatus = "删除失败：" + String(e); }
      await render();
    }

    async function runIndexToggle(code, currentEnabled) {
      try {
        await apiRequest("/api/v1/index-universe", "POST", {
          code, enabled: !currentEnabled,
        });
        indexStatus = `${code} 已${currentEnabled ? "停用" : "启用"}`;
      } catch (e) { indexStatus = "切换失败：" + String(e); }
      await render();
    }

    /* ---------- 复盘动作 ---------- */
    async function runBriefCopy() {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(briefText);
        } else {
          // Tauri webview 在某些情况下 clipboard API 不可用，回退到 textarea
          const ta = document.createElement("textarea");
          ta.value = briefText;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        briefCopyStatus = "已复制到剪贴板";
      } catch (e) { briefCopyStatus = "复制失败：" + String(e); }
      await render();
    }

    function runBriefDownload() {
      const blob = new Blob([briefText], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = exportFilename("brief", "md");
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 100);
      briefCopyStatus = "已触发下载";
      render();
    }

    async function runWatchAdd() {
      const code = $("watchCode").value.trim().toLowerCase();
      const name = $("watchName").value.trim();
      const group = $("watchGroup").value.trim() || "默认";
      const note = $("watchNote").value.trim();
      if (!/^(sh|sz|bj)\d{6}$/.test(code)) {
        universeStatus = "代码格式应为 sh/sz/bj + 6 位数字";
        return render();
      }
      try {
        await apiRequest("/api/v1/watchlist", "POST", { code, name, group, note });
        universeGroup = group;
        universeStatus = `${code} 已加入 ${group}`;
      } catch (e) { universeStatus = "添加失败：" + String(e); }
      await render();
    }

    async function runWatchDelete(group, code) {
      try {
        await apiRequest("/api/v1/watchlist/item?group=" + encodeURIComponent(group) + "&code=" + encodeURIComponent(code), "DELETE");
        universeStatus = `${code} 已删除`;
      } catch (e) { universeStatus = "删除失败：" + String(e); }
      await render();
    }

    async function runWatchScan(onlyCodes) {
      universeStatus = "正在抓取日线并计算技术指标…";
      await render();
      try {
        const codes = onlyCodes || await currentWatchCodes();
        if (!codes.length) throw new Error("当前分组没有股票");
        const data = await apiRequest("/api/v1/scan", "POST", { codes });
        universeStatus = `扫描 ${data.evaluated} 只，行情有效 ${data.evaluated_bars} 只，触发 ${data.triggered} 条信号`;
      } catch (e) { universeStatus = "扫描失败：" + String(e); }
      await render();
    }

    async function runWatchAi() {
      universeStatus = "正在采集新闻、市场和技术数据并运行五路分析…";
      await render();
      try {
        const codes = (await currentWatchCodes()).slice(0, 12);
        if (!codes.length) throw new Error("当前分组没有股票");
        researchResult = await apiRequest("/api/v1/research/select", "POST", { codes, max_candidates: 5 });
        currentTab = "ai";
        document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === currentTab));
        await render();
      } catch (e) {
        universeStatus = "AI 排名失败：" + String(e);
        await render();
      }
    }

    async function stageResearchOrder(code, price, qty, stopPrice, takeProfitPrice, riskBudgetPct, suggestedPositionPct) {
      orderDraft = {
        code, price: Number(price).toFixed(2), qty, side: "buy",
        riskPlan: {
          stop_price: Number(stopPrice).toFixed(2),
          take_profit_price: Number(takeProfitPrice).toFixed(2),
          risk_budget_pct: riskBudgetPct,
          suggested_position_pct: suggestedPositionPct,
          basis: "来自五路 AI 研究候选的波动率与 ATR 风险计划",
        },
      };
      currentTab = "account";
      document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === currentTab));
      await render();
      const status = $("orderStatus");
      if (status) status.textContent = "已按研究风险计划带入，请核对后提交模拟单";
    }

    async function stageRiskSell(code, price, qty) {
      orderDraft = { code, price: Number(price).toFixed(2), qty, side: "sell" };
      currentTab = "account";
      document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === currentTab));
      await render();
      const status = $("orderStatus");
      if (status) status.textContent = "已从风险中心带入卖单，请核对数量和价格后提交";
    }

    /* ---------- 动作 ---------- */
    async function runSnapshot() {
      const btn = $("refreshValuation");
      const out = $("snapshotStatus");
      btn.disabled = true;
      out.textContent = "正在获取全部持仓行情…";
      try {
        const res = await fetch(BASE + "/api/v1/paper/snapshot", { method: "POST" });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
        snapshotStatus = `已记录快照 · 权益 ${fmtNum(data.equity)}`;
        await render();
      } catch (e) {
        snapshotStatus = String(e);
        out.textContent = snapshotStatus;
        btn.disabled = false;
      }
    }

    /* ---------- 模拟下单 ---------- */
    async function runSubmitOrder() {
      const btn = $("orderGo");
      const out = $("orderStatus");
      const code = $("orderCode").value.trim().toLowerCase();
      const side = $("orderSide").value;
      const qty = Number($("orderQty").value);
      const priceRaw = $("orderPrice").value.trim();
      const price = priceRaw === "" ? null : Number(priceRaw);
      const stopRaw = $("orderStop").value.trim();
      const targetRaw = $("orderTarget").value.trim();
      const stopPrice = stopRaw === "" ? null : Number(stopRaw);
      const takeProfitPrice = targetRaw === "" ? null : Number(targetRaw);
      const signalId = $("orderSignal").value.trim();

      // 客户端预校验，减少无效请求
      if (!/^(sh|sz)\d{6}$/.test(code)) {
        out.textContent = "代码格式错：应为 sh/sz + 6 位数字";
        return;
      }
      if (!Number.isFinite(qty) || qty <= 0 || qty % 100 !== 0) {
        out.textContent = "数量必须是 100 的整数倍";
        return;
      }
      if (price !== null && (!Number.isFinite(price) || price <= 0)) {
        out.textContent = "价格必须为正数，留空走市价";
        return;
      }
      if ((stopPrice === null) !== (takeProfitPrice === null)) {
        out.textContent = "止损价和止盈价需要同时填写";
        return;
      }
      if (stopPrice !== null && (!Number.isFinite(stopPrice) || !Number.isFinite(takeProfitPrice) || stopPrice <= 0 || takeProfitPrice <= stopPrice)) {
        out.textContent = "风险计划应满足：止盈价 > 止损价 > 0";
        return;
      }

      const body = { code, side, qty };
      if (price !== null) body.price = price;
      if (signalId) body.signal_id = signalId;
      if (side === "buy" && stopPrice !== null) {
        body.risk_plan = {
          stop_price: stopPrice,
          take_profit_price: takeProfitPrice,
          risk_budget_pct: orderDraft?.riskPlan?.risk_budget_pct ?? 0.01,
          suggested_position_pct: orderDraft?.riskPlan?.suggested_position_pct ?? 0,
          basis: orderDraft?.riskPlan?.basis || "模拟单手动风险计划",
        };
      }

      btn.disabled = true;
      out.textContent = "正在下单…";
      try {
        const res = await fetch(BASE + "/api/v1/paper/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
        const filled = data.fill ? `已成交 ${data.fill.qty} @ ${fmtNum(data.fill.price)}` : "已挂单（pending）";
        out.textContent = `${code} ${side} ${qty}：${filled}；冻结/可用已更新`;
        // 清空表单的价格和数量（保留代码方便多次下单）
        $("orderQty").value = "";
        $("orderPrice").value = "";
        $("orderStop").value = "";
        $("orderTarget").value = "";
        $("orderSignal").value = "";
        orderDraft = null;
        await render(); // 刷新账户/挂单视图
      } catch (e) {
        out.textContent = String(e);
      } finally {
        btn.disabled = false;
      }
    }

    async function runCancelOrder(id) {
      try {
        const res = await fetch(BASE + "/api/v1/paper/order/" + encodeURIComponent(id), {
          method: "DELETE",
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
        await render();
      } catch (e) {
        alert("撤单失败：" + String(e));
      }
    }

    async function runAnalyze() {
      const code = $("aiCode").value.trim();
      const signalId = $("aiSignalId").value.trim();
      const out = $("aiResult");
      out.textContent = "调用中…";
      try {
        const res = await fetch(BASE + "/api/v1/ai/analyze/" + encodeURIComponent(code), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(signalId ? { signal_id: signalId } : {}),
        });
        const j = await res.json();
        if (!res.ok || !j.ok) throw new Error(j.error || `HTTP ${res.status}`);
        out.textContent = JSON.stringify(j, null, 2);
      } catch (e) {
        out.textContent = String(e);
      }
    }

    async function runResearchSelect() {
      const btn = $("researchGo");
      const status = $("researchStatus");
      const codes = $("researchCodes").value
        .split(/[,，\s]+/)
        .map(value => value.trim())
        .filter(Boolean);
      btn.disabled = true;
      const restore = () => { btn.disabled = false; };
      status.textContent = "采集数据并运行五路分析，可能需要几十秒…";
      try {
        const res = await fetch(BASE + "/api/v1/research/select", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ codes, max_candidates: 5 }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
        researchResult = data;
        await render();
        status.textContent = `完成：${(data.candidates || []).length} 个候选`;
      } catch (e) {
        status.textContent = String(e);
      } finally {
        restore();
      }
    }

    /* ---------- 启动 ---------- */
    document.querySelectorAll("#nav button").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll("#nav button").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        currentTab = b.dataset.tab;
        // 切到非 signals tab 时收起展开
        if (currentTab !== "signals") expandedSignalId = null;
        render();
      };
    });
    function updateConnection() {
      try {
        applyBase($("base").value);
        connectWs();
        render();
      } catch (e) {
        $("status").textContent = String(e.message || e);
        $("dot").className = "dot bad";
      }
    }

    $("btnConnect").onclick = updateConnection;
    $("base").addEventListener("change", updateConnection);
    try { applyBase(localStorage.getItem(STORAGE_KEY) || $("base").value); }
    catch { applyBase("http://127.0.0.1:8787"); }
    const isDesktop = Boolean(window.__TAURI_INTERNALS__);
    const platform = /Mac/.test(navigator.platform) ? "macOS" : /Win/.test(navigator.platform) ? "Windows" : "Web";
    $("clientKind").textContent = isDesktop ? `${platform} 客户端` : "Web 工作台";
    connectWs();
    render();
    // 只自动刷新只读总览/后验；表单页面自动重绘会打断用户输入。
    setInterval(() => {
      if (currentTab === "dashboard" || currentTab === "performance" || currentTab === "risk") render();
    }, 15000);
  </script>
</body>
</html>
