[package]
name = "mj-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "摸金小王子 · 家庭自用 AI 投研信号系统 NAS 后端"
license = "MIT"
repository = "https://github.com/helloAInative/mojin"
readme = "../README.md"
keywords = ["stock", "signals", "paper-trading", "rust", "sqlite"]
categories = ["finance", "web-programming::http-server"]

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
encoding_rs = "0.8"
futures = "0.3"
bytes = "1"
quick-xml = { version = "0.38", features = ["serialize"] }
